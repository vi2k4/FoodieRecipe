name: Deploy Develop

on:
    push:
        branches:
            - Viet

concurrency:
    group: foodie-develop
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Viet
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Verify EC2 connection
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.DEVELOP_EC2_HOST }}
                  username: ec2-user
                  key: ${{ secrets.DEVELOP_EC2_SSH_KEY }}
                  script: "true"

            - name: Prepare EC2 deploy directory
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.DEVELOP_EC2_HOST }}
                  username: ec2-user
                  key: ${{ secrets.DEVELOP_EC2_SSH_KEY }}
                  script: mkdir -p /home/ec2-user/foodie-develop

            - name: Copy EC2 deployment files
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.DEVELOP_EC2_HOST }}
                  username: ec2-user
                  key: ${{ secrets.DEVELOP_EC2_SSH_KEY }}
                  source: deploy/develop/docker-compose.yml,deploy/develop/deploy.sh
                  target: /home/ec2-user/foodie-develop
                  strip_components: 2
                  overwrite: true

            - name: Login Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DEVELOP_DOCKERHUB_TOKEN }}

            - name: Build and push backend develop
              uses: docker/build-push-action@v6
              with:
                  context: ./api
                  push: true
                  tags: |
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-backend:develop
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-backend:develop-${{ github.sha }}

            - name: Build and push frontend develop
              uses: docker/build-push-action@v6
              with:
                  context: ./web
                  push: true
                  build-args: |
                      NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
                      NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
                  tags: |
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-frontend:develop
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-frontend:develop-${{ github.sha }}

            - name: Deploy develop EC2
              uses: appleboy/ssh-action@v1.2.5
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DEVELOP_DOCKERHUB_TOKEN }}
                #   NEXT_PUBLIC_API_URL: $ {{ secrets.NEXT_PUBLIC_API_URL }}
                #   DEVELOP_FRONTEND_URL: $ {{ secrets.DEVELOP_FRONTEND_URL }}
                  NEXT_PUBLIC_API_URL: 3000
                  DEVELOP_FRONTEND_URL: 3001
                  GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
                  AWS_REGION: ${{ secrets.AWS_REGION }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
                  BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
                  CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
                  CLOUDFRONT_KEY_PAIR_ID: ${{ secrets.CLOUDFRONT_KEY_PAIR_ID }}
                  CLOUDFRONT_PRIVATE_KEY_BASE64: ${{ secrets.CLOUDFRONT_PRIVATE_KEY_BASE64 }}
                  CLOUDFRONT_URL_EXPIRES_IN: ${{ secrets.CLOUDFRONT_URL_EXPIRES_IN }}
                  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
                  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
              with:
                  host: ${{ secrets.DEVELOP_EC2_HOST }}
                  username: ec2-user
                  key: ${{ secrets.DEVELOP_EC2_SSH_KEY }}
                  envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,NEXT_PUBLIC_API_URL,DEVELOP_FRONTEND_URL,GOOGLE_CLIENT_ID,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_BUCKET_NAME,BEDROCK_MODEL_ID,CLOUDFRONT_DOMAIN,CLOUDFRONT_KEY_PAIR_ID,CLOUDFRONT_PRIVATE_KEY_BASE64,CLOUDFRONT_URL_EXPIRES_IN,RESEND_API_KEY,EMAIL_FROM
                  script: |
                      bash /home/ec2-user/foodie-develop/deploy.sh
