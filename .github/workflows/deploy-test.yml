name: Deploy Develop

on:
    push:
        branches:
            - Viet

concurrency:
    group: foodie-develop
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Viet
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Verify EC2 connection
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.DEVELOP_EC2_HOST }}
                  username: ec2-user
                  key: ${{ secrets.DEVELOP_EC2_SSH_KEY }}
                  script: "true"

            - name: Verify EC2 deploy directory
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.DEVELOP_EC2_HOST }}
                  username: ec2-user
                  key: ${{ secrets.DEVELOP_EC2_SSH_KEY }}
                  script: test -d /home/ec2-user/foodie-develop

            - name: Verify EC2 deploy script
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.DEVELOP_EC2_HOST }}
                  username: ec2-user
                  key: ${{ secrets.DEVELOP_EC2_SSH_KEY }}
                  script: test -f /home/ec2-user/foodie-develop/deploy.sh

            - name: Login Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DEVELOP_DOCKERHUB_TOKEN }}

            - name: Build and push backend develop
              uses: docker/build-push-action@v6
              with:
                  context: ./api
                  push: true
                  tags: |
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-backend:develop
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-backend:develop-${{ github.sha }}

            - name: Build and push frontend develop
              uses: docker/build-push-action@v6
              with:
                  context: ./web
                  push: true
                  build-args: |
                      NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
                      NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
                  tags: |
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-frontend:develop
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-frontend:develop-${{ github.sha }}

            - name: Deploy develop EC2
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.DEVELOP_EC2_HOST }}
                  username: ec2-user
                  key: ${{ secrets.DEVELOP_EC2_SSH_KEY }}
                  script: |
                      DEPLOY_DIR=/home/ec2-user/foodie-develop

                      if [ ! -d "$DEPLOY_DIR" ]; then
                        echo "DEPLOY_DIAGNOSTIC=missing_directory"
                        exit 1
                      fi

                      cd "$DEPLOY_DIR"

                      if [ ! -f deploy.sh ]; then
                        echo "DEPLOY_DIAGNOSTIC=missing_script"
                        exit 1
                      fi

                      bash deploy.sh
                      deploy_status=$?
                      exit "$deploy_status"
