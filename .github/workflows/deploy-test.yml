name: Deploy Develop

on:
    push:
        branches:
            - Viet

concurrency:
    group: foodie-develop
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Viet
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DEVELOP_DOCKERHUB_TOKEN }}

            - name: Build and push backend develop
              uses: docker/build-push-action@v6
              with:
                  context: ./api
                  push: true
                  tags: |
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-backend:develop
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-backend:develop-${{ github.sha }}

            - name: Build and push frontend develop
              uses: docker/build-push-action@v6
              with:
                  context: ./web
                  push: true
                  build-args: |
                      NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
                      NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
                  tags: |
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-frontend:develop
                      ${{ secrets.DEVELOP_DOCKERHUB_USERNAME }}/foodie-frontend:develop-${{ github.sha }}

            - name: Deploy develop EC2
              id: deploy
              continue-on-error: true
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.DEVELOP_EC2_HOST }}
                  username: ec2-user
                  key: ${{ secrets.DEVELOP_EC2_SSH_KEY }}
                  capture_stdout: true
                  script: |
                      DEPLOY_DIR=/home/ec2-user/foodie-develop

                      if [ ! -d "$DEPLOY_DIR" ]; then
                        echo "DEPLOY_DIAGNOSTIC=missing_directory"
                        exit 1
                      fi

                      cd "$DEPLOY_DIR"

                      if [ ! -f deploy.sh ]; then
                        echo "DEPLOY_DIAGNOSTIC=missing_script"
                        exit 1
                      fi

                      bash deploy.sh
                      deploy_status=$?
                      echo "DEPLOY_DIAGNOSTIC=script_exit_${deploy_status}"
                      exit "$deploy_status"

            - name: Verify EC2 deployment
              if: always()
              env:
                  DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
                  DEPLOY_OUTPUT: ${{ steps.deploy.outputs.stdout }}
              run: |
                  diagnostic="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep '^DEPLOY_DIAGNOSTIC=' | tail -n 1)"

                  if [ "$DEPLOY_OUTCOME" != "success" ]; then
                    message="${diagnostic:-DEPLOY_DIAGNOSTIC=ssh_or_remote_failure}"
                    echo "::error title=EC2 deployment failed::$message"
                    exit 1
                  fi
